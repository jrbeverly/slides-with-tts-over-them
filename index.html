<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slides with TTS Over</title>
<style>
  body { margin: 0; font: 16px/1.6 system-ui, sans-serif; color: #10263b; background: repeating-linear-gradient(45deg, #fff8e1 0 24px, #ffefc2 24px 48px); min-height: 100vh; }
  main { max-width: 1080px; margin: 0 auto; padding: 48px 16px; }
  h1 { display: inline-block; font-size: clamp(2rem, 6vw, 3.4rem); line-height: 1.05; margin: 0 0 16px; padding: 4px 14px; background: #10263b; color: #ffcc4d; transform: rotate(-1.5deg); }
  .lede { max-width: 680px; margin: 0 0 28px; }
  video { width: 100%; border: 4px solid #10263b; border-radius: 12px; box-shadow: 10px 10px 0 #ff6b4a; background: #000; }
</style>
</head>
<body>
<main>
  <h1>Slides with TTS Over</h1>
  <p class="lede">JSON slide data rendered to images with Pillow, laid over a Chatterbox narration with a demo clip spliced in at the cue.</p>
  <video controls preload="metadata" src="docs/acme-sprint-report.mp4"></video>
</main>
</body>
</html>
